server:
  port: ${PORT:8080}

spring:
  application:
    name: chamada-admig
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chamada_admig}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-me-in-production}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    default-email: ${ADMIN_EMAIL:admin@admig.org}
    default-password: ${ADMIN_PASSWORD:Admig@2025!}
  secretary:
    default-email: ${CLEO_EMAIL:}
    default-password: ${CLEO_PASSWORD:}
